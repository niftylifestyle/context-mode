name: Sync upstream main

on:
  schedule:
    # 1日ごと
    - cron: "0 10 * * *"

  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_REPO: mksglu/context-mode
  UPSTREAM_BRANCH: main
  SYNC_BRANCH: automation/upstream-main-sync

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout fork
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Sync upstream changes
        id: sync
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # upstreamを追加
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"

          # Fork側 main を最新化
          git fetch origin "${UPSTREAM_BRANCH}"

          # 上流 main を取得
          git fetch upstream "${UPSTREAM_BRANCH}"

          # Fork側 main をベースに同期ブランチを作成
          git checkout -B "${SYNC_BRANCH}" "origin/${UPSTREAM_BRANCH}"

          # upstream main を取り込む
          if ! git merge --no-edit "upstream/${UPSTREAM_BRANCH}"; then
            echo "::error::Upstream merge conflict detected."
            git merge --abort
            exit 1
          fi

          # 差分がない場合は終了
          if git diff --quiet "origin/${UPSTREAM_BRANCH}" HEAD; then
            echo "No upstream changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Upstream changes detected."

          # 同期ブランチをForkへpush
          git push --force origin "${SYNC_BRANCH}"

          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Create or update Pull Request
        id: pr
        if: steps.sync.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          # 既存の同期PRを検索
          PR_NUMBER="$(
            gh pr list \
              --repo "$GH_REPO" \
              --head "$SYNC_BRANCH" \
              --base "$UPSTREAM_BRANCH" \
              --state open \
              --json number \
              --jq '.[0].number // empty'
          )"

          if [ -n "$PR_NUMBER" ]; then
            echo "Existing PR #${PR_NUMBER} found."

            # 新しいupstream差分が入ったのでCopilotを再依頼
            gh pr edit "$PR_NUMBER" \
              --add-reviewer "@copilot"

            PR_URL="$(
              gh pr view "$PR_NUMBER" \
                --repo "$GH_REPO" \
                --json url \
                --jq '.url'
            )"

            echo "created=false" >> "$GITHUB_OUTPUT"
            echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
            echo "url=$PR_URL" >> "$GITHUB_OUTPUT"

            exit 0
          fi

          # 新規PR作成
          PR_URL="$(
            gh pr create \
              --repo "$GH_REPO" \
              --base "$UPSTREAM_BRANCH" \
              --head "$SYNC_BRANCH" \
              --title "chore: sync upstream main" \
              --body "$(cat <<EOF
          ## Upstream synchronization

          This PR syncs changes from:

          - Upstream: https://github.com/${UPSTREAM_REPO}
          - Branch: ${UPSTREAM_BRANCH}

          The PR was automatically created by GitHub Actions.

          GitHub Copilot review is requested automatically.
          EOF
          )" \
              --reviewer "@copilot"
          )"

          PR_NUMBER="$(
            gh pr view "$PR_URL" \
              --repo "$GH_REPO" \
              --json number \
              --jq '.number'
          )"

          echo "PR created: $PR_URL"

          echo "created=true" >> "$GITHUB_OUTPUT"
          echo "number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "url=$PR_URL" >> "$GITHUB_OUTPUT"
